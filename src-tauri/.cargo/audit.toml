# cargo-audit configuration. CI runs it as `cd src-tauri && cargo audit`, so
# the file lives here.
#
# The entries below are transitive dependencies pinned by Tauri's GTK stack
# (gtk-rs 0.18 -> glib) and by idna/url (unic-ucd-*). They cannot be bumped
# without an upstream Tauri release, and none is reachable from this app's use
# of the stack. Reviewed 2026-09-15 — drop an entry once Tauri ships gtk-rs
# 0.19+ / a url that no longer pulls unic-ucd-*.
[advisories]
ignore = [
  "RUSTSEC-2024-0429", # glib VariantStrIter unsoundness (gtk-rs 0.18)
  "RUSTSEC-2025-0098", # unic-ucd-version unmaintained (idna/url)
  "RUSTSEC-2025-0100", # unic-ucd-ident unmaintained (idna/url)
]
